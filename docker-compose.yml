services:
  database:
    image: mysql:8.0
    container_name: calc_db_cont
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: calc_db
    ports:
      - "3388:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: calc_be_cont
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: calc_fe_cont
    restart: always
    ports:
      - "3005:80"
    depends_on:
      - backend

volumes:
  db_data: